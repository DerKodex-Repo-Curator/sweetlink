name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer matching package.json and a dated changelog section
        required: true
        type: string
      dry_run:
        description: Validate, build, and verify without publishing
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
      id-token: write
    uses: openclaw/release-workflows/.github/workflows/release-npm-package.yml@v1
    with:
      version: ${{ inputs.version || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      require-signed-tag: true
      strict-checks: true
      ci-check-events: '["push"]'
      node-version: '24'
      package-manager: pnpm
      package-manager-version: '11.28.2'
      test-command: pnpm lint && pnpm typecheck && pnpm test
      build-command: pnpm build
      smoke-command: sweetlink --version && sweetlink --help && sweetlinkd --help
